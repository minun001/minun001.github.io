name: Update Google Scholar Data

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/update-scholar-metrics.yml"
      - "tools/update_scholar_metrics.py"
      - "tools/scholar_publication_overrides.json"
      - "_data/google-scholar-metrics.json"
      - "_data/google-scholar-publications.json"
      - "_tests/test_scholar_refresh.py"
  workflow_dispatch:
  schedule:
    - cron: "15 15 * * *"

permissions:
  contents: write

concurrency:
  group: scholar-metrics-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Test Scholar refresh safeguards
        run: python -B -m unittest discover -s _tests -p test_scholar_refresh.py -v

      - name: Refresh Google Scholar data
        id: scholar
        run: python tools/update_scholar_metrics.py

      - name: Report refresh failure
        if: failure() && steps.scholar.outcome == 'failure'
        run: echo "Scholar could not be refreshed. The last successful snapshot remains published; checked dates were not advanced." >> "$GITHUB_STEP_SUMMARY"

      - name: Commit and push updated snapshot
        run: |
          if git diff --quiet; then
            echo "No Scholar changes detected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/google-scholar-metrics.json _data/google-scholar-publications.json
          git commit -m "Update Google Scholar data"
          git push
